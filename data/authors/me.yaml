bio: |
  Mohsen Farhadloo is an Associate Professor of Business Analytics in the Supply Chain
  and Business Technology Management department at the John Molson School of Business,
  Concordia University, and holds the Concordia Research Chair in Business Analytics for
  Public Health and Policy.

  With a background in statistical learning and data mining, he studies how organizations,
  individuals, and society can use the ever-increasing amount of online data in their
  decision-making. He develops and applies new statistical models to study customer
  satisfaction, public health, and public policy, and is currently working on social media
  analytics with applications in public health, public policy, and management.

